name: Release

on: workflow_dispatch

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      # @changesets/changelog-github is ESM only and needs a Node version that
      # supports require(esm), so don't rely on the runner's default Node
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli
      - name: install wasm-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
      - name: install dependencies
        run: pnpm install
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset-version
          publish: pnpm changeset-publish
        # no NPM_TOKEN on purpose: npm authenticates the publish with trusted
        # publishing (OIDC via `id-token: write`), configured on npmjs.com for
        # this workflow file. With an NPM_TOKEN set, changesets/action would
        # write it to .npmrc instead.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
