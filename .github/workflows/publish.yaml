 # yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  create_nuget:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # The native libraries are committed to the repo, built and tested by the Native workflow.
    # OPAQUE.Net.csproj fails the pack if any of them is missing.
    - run: dotnet pack .Net/OPAQUE.Net/OPAQUE.Net.csproj --configuration Release --output ${{ env.NuGetDirectory }}

    # A package that silently lost a platform is worse than a failed publish, so assert the layout
    # before anything reaches nuget.org.
    - name: Verify the package carries every supported runtime
      run: |
        $expected = @(
          'runtimes/linux-x64/native/libopaque.so'
          'runtimes/linux-arm64/native/libopaque.so'
          'runtimes/win-x64/native/opaque.dll'
          'runtimes/win-arm64/native/opaque.dll'
          'runtimes/osx-x64/native/libopaque.dylib'
          'runtimes/osx-arm64/native/libopaque.dylib'
          'lib/net8.0/OPAQUE.Net.dll'
        )
        $package = Get-ChildItem "${{ env.NuGetDirectory }}" -Filter *.nupkg | Select-Object -First 1
        if (-not $package) { throw "dotnet pack produced no .nupkg" }
        Write-Host "Inspecting $($package.Name)"

        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
        try { $entries = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' } }
        finally { $zip.Dispose() }

        $missing = $expected | Where-Object { $entries -notcontains $_ }
        if ($missing) {
          Write-Host "Package contains:"
          $entries | ForEach-Object { Write-Host "  $_" }
          throw "Package is missing: $($missing -join ', ')"
        }
        Write-Host "All $($expected.Count) expected entries are present."

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v4
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*.nupkg

  deploy:
    runs-on: ubuntu-latest
    needs: create_nuget
    steps:
      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
